name: Playwright Regression & Quality Gate

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  e2e-regression:
    name: Run E2E Test Suite (25 Tests)
    timeout-minutes: 30
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install NPM Dependencies
        run: npm ci

      - name: Install Playwright Browsers & OS Dependencies
        run: npx playwright install --with-deps chromium

      - name: Execute Playwright Regression
        run: npx playwright test tests/e2e/ --project=Chromium
        env:
          BASE_URL: https://ovenglow-bakery.vercel.app
          STAFF_EMAIL: ${{ secrets.STAFF_EMAIL }}
          STAFF_PASSWORD: ${{ secrets.STAFF_PASSWORD }}
          CI: true

      - name: Generate Mochawesome Dashboard Report
        if: always()
        run: |
          npx mochawesome-report-generator test-results/jsonReport.json --reportDir mochawesome-report --reportFilename index.html

      - name: Upload Mochawesome Report Artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mochawesome-dashboard-report
          path: mochawesome-report/
          retention-days: 14
name: Playwright Regression & Quality Gate

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  e2e-regression:
    name: Run E2E Test Suite (25 Tests)
    timeout-minutes: 30
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install NPM Dependencies
        run: npm ci

      - name: Cache Playwright Browsers
        id: playwright-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('**/package-lock.json') }}

      - name: Install Playwright Browsers & OS Dependencies
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium

      - name: Execute Playwright Regression
        run: npx playwright test tests/e2e/ --project=Chromium
        env:
          BASE_URL: https://ovenglow-bakery.vercel.app
          STAFF_EMAIL: ${{ secrets.STAFF_EMAIL }}
          STAFF_PASSWORD: ${{ secrets.STAFF_PASSWORD }}
          CI: true

      - name: Upload Test Report & Artifacts
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-execution-report
          path: |
            playwright-report/
            test-results/
          retention-days: 14